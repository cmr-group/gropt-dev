[project]
name = "gropt"
dynamic = ["version"]
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
gui = ["pyqt6", "matplotlib"]
dev = ["jupyterlab", "wheel", "scipy", "twine", "seaborn"]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-jupyter",
    "mkdocstrings-python",
    "mkdocs-awesome-nav",
]

[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.0", "setuptools-scm>=8"]
build-backend = "scikit_build_core.build"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.setuptools_scm"

[tool.setuptools_scm]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 pp*"
test-command = "python -c \"import gropt; gropt.demo()\""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
test-skip = "*-macosx_x86_64"

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
gropt = { path = ".", editable = true }

[tool.pixi.feature.dev.dependencies]
cmake = ">=3.17"
nanobind = ">=2.0"
scikit-build-core = ">=0.10"
setuptools-scm = ">=8"
pip = "*"

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "docs"], solve-group = "default" }

[tool.pixi.tasks]
clean = "python clean.py"
rebuild = { cmd = "python -m pip install --no-build-isolation -v -e .", depends-on = [
    "clean",
] }
rebuild-test = "python -m pip uninstall gropt -y; python -m pip install --no-build-isolation -e . -C cmake.define.GROPT_EIGEN_ASSERTIONS=ON"
