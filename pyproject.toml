[project]
name = "gropt"
version = "2.0.0.dev2"
dependencies = [
  "numpy",
  "matplotlib",
]


[project.optional-dependencies]
gui = ["pyqt6"]
dev = ["jupyterlab", "setuptools>=18.0", "cython>=0.18", "wheel", "pybind11-stubgen", "scipy", "twine", "seaborn"]
docs = ["mkdocs", "mkdocs-material", "mkdocs-jupyter", "mkdocstrings-python", "mkdocs-awesome-nav", "pybind11-stubgen"]

[build-system]
requires = ["setuptools>=18.0", "cython>=0.18", "wheel", "numpy"]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_* *-manylinux_i686 *-win32 pp*"
test-command = "python -c \"import gropt; gropt.demo(plot=False);\""

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["win-64"]

[tool.pixi.pypi-dependencies]
gropt = { path = ".", editable = true }

[tool.pixi.environments]
default = { solve-group = "default" }
dev = { features = ["dev", "docs"], solve-group = "default" }

[tool.pixi.tasks]
rebuild = "python setup.py build_ext --inplace"
