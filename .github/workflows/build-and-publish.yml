name: Build and Publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  check_version:
    name: Check version matches tag
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - name: Verify version matches tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          echo "Tag: $TAG  |  pyproject.toml: $VERSION"
          if [ "$TAG" != "$VERSION" ]; then
            echo "ERROR: tag v$TAG does not match pyproject.toml version $VERSION — did you forget to bump the version?"
            exit 1
          fi

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: [check_version]
    if: always() && (needs.check_version.result == 'success' || needs.check_version.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.3.1

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  build_sdist:
    name: Build source distribution
    needs: [check_version]
    if: always() && (needs.check_version.result == 'success' || needs.check_version.result == 'skipped')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: pip install build

      - name: Build sdist
        run: python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  test:
    name: Test with Eigen assertions
    needs: [check_version]
    if: always() && (needs.check_version.result == 'success' || needs.check_version.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        run: pip install scikit-build-core nanobind

      - name: Install gropt with Eigen assertions enabled
        run: pip install --no-build-isolation -e . -C cmake.define.GROPT_EIGEN_ASSERTIONS=ON

      - name: Smoke test
        run: python -c "import gropt; gropt.demo()"

  publish:
    name: Publish to PyPI
    needs: [build_wheels, build_sdist, test]
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    environment:
      name: pypi
      url: https://pypi.org/p/gropt
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
