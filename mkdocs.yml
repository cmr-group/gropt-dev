site_name: GrOpt
site_url: https://cmr-group.github.io/gropt-dev/
repo_url: https://github.com/cmr-group/gropt-dev

# figure scripts live next to their images
exclude_docs: |
  img/*.py

theme:
  name: material
  custom_dir: overrides
  logo: img/gropt_logo_header.png
  favicon: img/favicon.png
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  # starts from the system light/dark setting; the header button flips it (the icon shows the other mode)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - announce.dismiss
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.details
  - pymdownx.arithmatex:
      generic: true
  - toc
  - tables
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra_css:
  - css/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

hooks:
  - overrides/hooks.py

plugins:
    - mkdocs-jupyter
    - search
    - awesome-nav
    - mkdocstrings:
        handlers:
          python:
            options:
              docstring_style: numpy
              show_root_heading: true
              separate_signature: true
              show_signature_annotations: true
              show_labels: false
              show_root_toc_entry: false
              allow_inspection: false
              show_source: false

