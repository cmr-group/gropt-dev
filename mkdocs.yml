site_name: GrOpt

site_url: https://temp.org
theme:
  name: material
  palette:
    scheme: slate
  features:
    - navigation.tabs

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  - toc
  - tables

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

plugins:
    - mkdocs-jupyter
    - search
    - awesome-nav
    - mkdocstrings:
        handlers:
          python:
            options:
              docstring_style: numpy
              show_root_heading: true
              separate_signature: true
              show_signature_annotations: true
              show_labels: false

